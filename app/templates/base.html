<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ML Сервис{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🤖 ML Сервис</h1>
        {% if user %}
            <div class="user-info">
                <span>{{ user.login }} ({{ user.balance }}₽)</span>
                <a href="/logout">Выйти</a>
            </div>
        {% endif %}
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
