services:
  app:
    build: ./app
    env_file:
      - ./app/.env
    depends_on:
      - database
      - rabbitmq
    restart: unless-stopped

  worker-1:
    build: ./app
    env_file:
      - ./app/.env
    environment:
      - WORKER_ID=worker-1
    command: python worker.py
    depends_on:
      - rabbitmq
    restart: unless-stopped

  worker-2:
    build: ./app
    env_file:
      - ./app/.env
    environment:
      - WORKER_ID=worker-2
    command: python worker.py
    depends_on:
      - rabbitmq
    restart: unless-stopped

  web-proxy:
    build: ./web-proxy
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ml_app
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data: